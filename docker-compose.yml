# Local testing (Mac, or the Pi itself before adding TLS) - plain HTTP,
# published to localhost only. For an actual internet-facing deployment,
# use docker-compose.pi.yml instead, which adds Caddy for TLS and doesn't
# publish this service's port directly.
services:
  halaxy-mcp:
    build: .
    image: halaxy-mcp:local
    env_file: .env
    environment:
      # The Dockerfile sets MCP_HOST=0.0.0.0 (so the container is
      # reachable at all), but that's not a usable OAuth redirect target
      # from the host/browser - override the public URL explicitly to
      # match where this is actually published below.
      MCP_PUBLIC_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persists registered OAuth clients + access tokens across
      # `docker compose up --build`, so re-testing after a code change
      # doesn't force every connected client to reconnect.
      - oauth_state:/data
    restart: unless-stopped

volumes:
  oauth_state:
