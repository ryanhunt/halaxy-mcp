# Internet-facing deployment (the Raspberry Pi). Caddy terminates TLS
# (auto-issued/renewed via Let's Encrypt) and reverse-proxies to the app.
# The app container has no `ports:` mapping - it's only reachable from
# Caddy over the compose-internal network, never bound to the host
# directly. Requires Caddyfile.example copied to Caddyfile with your real
# domain, and Unifi port-forwarding 80+443 to this Pi.
services:
  halaxy-mcp:
    build: .
    image: halaxy-mcp:latest
    env_file: .env
    expose:
      - "8000"
    volumes:
      # Persists registered OAuth clients + access tokens across
      # `docker compose up --build` (i.e. every code update) - without
      # this, every connected client (Claude, Copilot, ChatGPT) has to
      # reconnect after every redeploy, since the in-memory OAuth state
      # would otherwise be wiped on every restart.
      - oauth_state:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - halaxy-mcp

volumes:
  caddy_data:
  caddy_config:
  oauth_state:
